[project]
name = "vectordb-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.102",
    "fastapi>=0.141.1",
    "fastparquet>=2026.5.0",
    "lxml>=6.1.3",
    "pandas>=3.0.6",
    "prefect>=3.8.6",
    "pyarrow>=25.0.1",
    "pyiceberg[sql-sqlite]>=0.12.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.12",
    "requests>=2.34.2",
    "tokenizers>=0.21",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: chama servicos externos de verdade (pytest -m integration)",
]
# por padrao a suite nao toca a rede; -m na linha de comando sobrepoe isto
addopts = "-m 'not integration'"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "mcp>=2.2",
    "mypy>=2.3.1",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.1.1",
    "streamlit>=1.40",
]

[[tool.mypy.overrides]]
# pyarrow, pyiceberg e botocore nao publicam stubs de tipo
module = ["pyarrow.*", "pyiceberg.*", "botocore.*", "tokenizers.*"]
ignore_missing_imports = true
